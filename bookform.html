<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- link for icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <!-- link for css -->

    <link rel="stylesheet" href="./css/main.min.css" />

    <!--  favicon icon -->
    <link rel="shortcut icon" href="Favicon/favicon.ico" type="image/x-icon" />

    <!-- Script link -->
    <script defer src="js/script.js"></script>
    <title>Travel Guider</title>
  </head>
  <body>
    <!-- Book -->
    <section class="book">
      <article class="booK-center hidden" id="hide">
        <div class="book-title">
          <h1>book your trip✈</h1>
          <div class="underline bookline"></div>
        </div>
        <form
          action="book.php"
          method="POST"
          class="form-section"
          autocomplete="on"
        >
          <div>
            <label for="Name">FulName:</label>
            <input
              type="text"
              name="Name"
              id="name"
              required
              placeholder="enter your full name"
              class="inputs"
            />
          </div>
          <div>
            <label for="email">Email:</label>
            <input
              type="email"
              name="email"
              id="email"
              required
              placeholder="enter your email"
              class="inputs"
            />
          </div>
          <div>
            <label for="phone">Phone:</label>
            <input
              type="tel"
              id="phone"
              name="phone"
              placeholder="enter your phone number"
              class="inputs"
            />
          </div>
          <div>
            <label for="address">Address:</label>
            <input
              type="text"
              name="address"
              id="address"
              required
              placeholder="enter your address"
              class="inputs"
            />
          </div>
          <div>
            <label for="Place">Where to:</label>
            <select name="place" id="place" class="inputs">
              <option value="Arbaminch">Arbaminch</option>
              <option value="GonderTana">GonderTana</option>
              <option value="HararDire">HararDire</option>
              <option value="jimmaBonga">jimmaBonga</option>
              <option value="Afar">Afar</option>
              <option value="Tigray">Tigray</option>
              <option value="Wolo">Wolo</option>
            </select>
          </div>
          <div>
            <label for="number">How many:</label>
            <input
              type="number"
              name="number"
              id="number"
              placeholder="number of guests"
              class="inputs"
              required
            />
          </div>
          <div>
            <label for="date">When You want visit:</label>
            <input type="date" name="date" id="date" class="inputs" required />
          </div>

          <div class="boookers">
            <input
              type="submit"
              name="send"
              class="btn submitbtns"
              value="submit"
            />
            <input type="reset" class="btn clearbtns" value="clear" />
          </div>
        </form>
        <a href="Home.html" class="back">Back</a>
      </article>
    </section>
    <!-- eno of Book -->

    <script src="./js/script.js"></script>
  </body>
</html>
